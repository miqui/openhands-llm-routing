[project]
name = "ohrouting"
version = "0.1.0"
description = "Experiment harness comparing LLM routing policies for OpenHands"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ohrouting"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
